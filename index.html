<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>alperen abi</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <header class="site-header">
    <h1>Öğrenci Ders Notları</h1>
    <p class="lead">Öğretmenlerin paylaştığı ders notlarını burada görebilirsiniz.</p>
  </header>

  <main class="container">
    <div class="controls">
      <input id="search" type="search" placeholder="Ara (ders, öğretmen, başlık)...">
      <select id="filter-subject">
        <option value="">Tüm dersler</option>
      </select>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Ders</th>
          <th>Başlık</th>
          <th>Öğretmen</th>
          <th>Not</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Matematik</td>
          <td><a href="#" class="note-link" data-id="1">Fonksiyonlar ve Grafikler</a></td>
          <td>Ahmet Yılmaz</td>
          <td>90</td>
        </tr>
        <tr>
          <td>Fizik</td>
          <td><a href="#" class="note-link" data-id="2">Newton'un Hareket Yasaları</a></td>
          <td>Mehmet Demir</td>
          <td>85</td>
        </tr>
      </tbody>

    </table>

 

    

    <div id="note-modal" class="modal hidden" role="dialog" aria-hidden="true">
      <div class="modal-content">
        <button id="close-modal" class="close">Kapat</button>
        <h2 id="modal-title"></h2>
        <p class="meta"><span id="modal-teacher"></span> — <span id="modal-subject"></span> — <time id="modal-date"></time></p>
        <article id="modal-body"></article>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <small>Statik örnek site — öğretmen notları örnek verilerle gösterilmektedir.</small>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
